name: Continuous Delivery

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/trabalho-fase-6:${{ github.sha }}
          file: ./Dockerfile

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'staging'

    steps:
      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'umbl-ultimato-dev'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_PROFILE_DEV }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/trabalho-fase-6:${{ github.sha }}'

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'

    steps:
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'umbl-ultimato-prd'
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_PROFILE }}
          images: 'index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/trabalho-fase-6:${{ github.sha }}'